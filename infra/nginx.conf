# Reverse proxy for the Trade Monitoring Dashboard.
#
# Terminates HTTP on :80 and forwards to the gunicorn process (the `web`
# docker-compose service, or a bare-metal gunicorn on the same host —
# adjust `server` below accordingly). Static files are served directly by
# nginx rather than proxied through gunicorn.

upstream trade_monitor {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 4M;

    location /static/ {
        alias /app/staticfiles/;
    }

    location / {
        proxy_pass http://trade_monitor;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
